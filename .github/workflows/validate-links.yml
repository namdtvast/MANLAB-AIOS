name: Validate links

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kiểm tra toàn vẹn link giữa các tầng (manifest/links/capability)
        run: python3 _meta/validate_links.py

      # Chế độ CHẶN. Bật được vì repo đã về 0 trích dẫn hỏng (11 chỗ tồn đọng đã sửa ngày
      # 25/08/2026). Giữ ở mức chặn thì lỗi mới không tích lại thành một đợt dọn khác.
      # LƯU Ý: bộ kiểm chỉ bắt "mục không tồn tại"; trích dẫn trỏ tới mục CÓ THẬT nhưng SAI mục
      # vẫn lọt — CI xanh KHÔNG đồng nghĩa với trích dẫn đúng.
      - name: Kiểm tra trích dẫn điều khoản ETV.Pxx §y.z
        run: python3 _meta/validate_citations.py --chan

      # Chế độ CẢNH BÁO (không --chan) là CÓ CHỦ ĐÍCH, đừng "sửa" thành chặn khi chưa dọn xong.
      # Bộ kiểm này ra đời ngày 31/08/2026 và ngay lần chạy đầu đã lộ 69 mã biểu mẫu nằm trong thủ
      # tục đã ban hành mà manifest chưa từng khai. Chặn ngay sẽ làm đỏ mọi PR không liên quan; dọn
      # xong tồn đọng thì đổi sang `--chan` như validate_citations đã làm.
      - name: Kiểm tra biểu mẫu áp dụng (mục VII ↔ manifest.forms)
        run: python3 _meta/validate_forms.py
