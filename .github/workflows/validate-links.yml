name: Validate links

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kiểm tra toàn vẹn link giữa các tầng (manifest/links/capability)
        run: python3 _meta/validate_links.py

      # Chế độ CHẶN. Bật được vì repo đã về 0 trích dẫn hỏng (11 chỗ tồn đọng đã sửa ngày
      # 25/08/2026). Giữ ở mức chặn thì lỗi mới không tích lại thành một đợt dọn khác.
      # LƯU Ý: bộ kiểm chỉ bắt "mục không tồn tại"; trích dẫn trỏ tới mục CÓ THẬT nhưng SAI mục
      # vẫn lọt — CI xanh KHÔNG đồng nghĩa với trích dẫn đúng.
      - name: Kiểm tra trích dẫn điều khoản ETV.Pxx §y.z
        run: python3 _meta/validate_citations.py --chan
