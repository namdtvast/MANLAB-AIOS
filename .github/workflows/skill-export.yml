name: Validate & Export Skills

on:
  push:
    branches:
      - main
    paths:
      - "07_AI_OPERATING_SYSTEM/01_Skills/**"
      - "_meta/export_*.py"
      - "_meta/skills_schema.json"
  pull_request:
    branches:
      - main
    paths:
      - "07_AI_OPERATING_SYSTEM/01_Skills/**"
      - "_meta/export_*.py"
      - "_meta/skills_schema.json"

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install jsonschema

      - name: Validate SKILL.md files
        run: |
          python3 _meta/validate_skill_schema.py

      - name: Export skills to IDE formats
        run: |
          python3 _meta/export_all_skills.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --exit-code; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push exported files
        if: steps.check_changes.outputs.changes == 'true' && github.event_name == 'push'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .cursor/skills.json
          git add .vscode/copilot-skills.json
          git add .openai/skills.json
          git commit -m "chore(skills): tự động export skills" || true
          git push

      - name: Comment on PR with export status
        if: github.event_name == 'pull_request' && steps.check_changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✓ Skills validated and exported successfully.\n\nChanged files:\n- .cursor/skills.json\n- .vscode/copilot-skills.json\n- .openai/skills.json"
            })
