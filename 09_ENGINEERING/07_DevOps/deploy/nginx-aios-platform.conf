# Nginx — MANLAB-AIOS Platform (Next.js, app duy nhất)
# Domain: aios.manlab.vn  →  proxy tới manlab-aios-platform.service (127.0.0.1:3000)
# Cài đặt: sudo cp nginx-aios-platform.conf /etc/nginx/sites-available/aios.manlab.vn
#          sudo ln -s /etc/nginx/sites-available/aios.manlab.vn /etc/nginx/sites-enabled/
# certbot --nginx sẽ tự thêm block 443/SSL bên dưới sau khi chạy lần đầu.

server {
    listen 80;
    listen [::]:80;
    server_name aios.manlab.vn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dùng WebSocket cho HMR (chỉ dev) và một số tính năng runtime —
        # giữ header Upgrade để không chặn nhầm nếu sau này cần.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
