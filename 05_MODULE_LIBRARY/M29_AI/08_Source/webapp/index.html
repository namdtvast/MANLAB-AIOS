<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIOS · Quản trị AI (M29 + M35)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/>
          <path d="M16 3.5v6M16 22.5v6M3.5 16h6M22.5 16h6" stroke="var(--accent-ink)" stroke-width="1.6"/>
          <circle cx="16" cy="16" r="6" stroke="var(--accent-ink)" stroke-width="1.6"/>
        </svg>
        <div><b>ManLab · ETV</b><span>AIOS Control Plane</span></div>
      </div>
      <div class="navsec">Nền tảng</div>
      <div class="nav"><select class="rolesel" id="platform"></select></div>
      <div class="navsec" style="margin-top:8px">Điều hướng</div>
      <nav class="nav" id="nav">
        <button data-screen="dashboard" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Dashboard</button>
        <button data-screen="platforms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>Platforms</button>
        <button data-screen="models"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Models &amp; Providers</button>
        <button data-screen="agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 9h.01M9 15c1 1 5 1 6 0"/></svg>Agents</button>
        <button data-screen="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 7l3 3-8 8H6v-3z"/></svg>Skills / Tools</button>
        <button data-screen="prompts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Prompts</button>
        <button data-screen="governance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 4v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V7z"/></svg>Guardrails &amp; Policies</button>
        <button data-screen="aia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 001.7 3h16.6a2 2 0 001.7-3L14 3.9a2 2 0 00-3.4 0z"/></svg>AI Impact Assessment</button>
        <button data-screen="evaluations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>Evaluations</button>
        <button data-screen="traces"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Traces &amp; Logs</button>
        <button data-screen="usage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Token &amp; Cost</button>
        <button data-screen="secrets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>Secrets</button>
        <button data-screen="audit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6M9 16h6M9 8h6M5 4h14v16H5z"/></svg>Audit Log</button>
      </nav>
      <div class="navsec" style="margin-top:8px">Đóng vai (thử phân quyền)</div>
      <div class="nav">
        <select class="rolesel" id="role">
          <option value="AI_VIEWER">AI_VIEWER — Xem</option>
          <option value="AI_OPERATOR">AI_OPERATOR — Vận hành</option>
          <option value="AI_ADMIN" selected>AI_ADMIN — Quản trị</option>
          <option value="AI_SECURITY_ADMIN">AI_SECURITY_ADMIN — Bảo mật</option>
          <option value="AI_AUDITOR">AI_AUDITOR — Kiểm toán</option>
          <option value="SUPER_ADMIN">SUPER_ADMIN — Toàn quyền</option>
        </select>
        <div class="rolehint">RBAC mô phỏng qua header — không phải auth production.</div>
      </div>
      <div class="foot">
        <div style="font-weight:600;color:var(--ink)" id="roleName">Dương Thành Nam</div>
        <div style="font-size:11px;color:var(--ink-3)" id="roleDesc">AI_ADMIN</div>
        <button class="btn ghost" id="reset" style="margin-top:10px;padding:6px 10px;font-size:12px">↺ Đặt lại dữ liệu mẫu</button>
      </div>
    </aside>
    <div class="main">
      <div class="top">
        <div class="crumb">MANLAB-AIOS <span>/</span> M29+M35 <span>/</span> <b id="crumb">Dashboard</b></div>
        <div class="spacer"></div>
        <button class="iconbtn" id="theme" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </button>
      </div>
      <div class="wrap"><div id="view"></div></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
