# HDSD — hướng dẫn dùng module M29 theo tuần tự, hiển thị trong khung Căn cứ ở đầu
# trang /modules/M29 của aios-platform (mục "Hướng dẫn sử dụng").
#
# Đây là NGUỒN SỰ THẬT của hướng dẫn: prisma/seed.ts đọc file này, kiểm tra lược đồ bằng
# parseHdsd() rồi nạp vào PlatformModule.hdsd — KHÔNG viết hướng dẫn thẳng trong JSX.
# Mỗi bước bám đúng luật đã cài trong src/lib/m29/rules.ts và thủ tục tương ứng; sửa quy tắc
# thì sửa thủ tục trước (MP14), rồi rules.ts, rồi file này.

schema: manlab-aios/hdsd@1.0
module: M29
summary: "Văn phòng AI: đăng ký hệ thống AI, đánh giá tác động, giám sát chi phí và xử lý sự cố AI"

steps:
  - role: "Quản trị AI"
    action: "Đăng ký Provider, Model, Skill, Tool và Platform vào danh mục"
    path: "/modules/M29/registry"
    note: "AI không nằm trong danh mục là AI chưa đăng ký — không được dùng cho công việc của Viện."
  - role: "Chủ sở hữu hệ thống AI, Đầu mối kỹ thuật"
    action: "Đăng ký hệ thống AI vào sổ Agent — mỗi bản ghi là một dòng của biểu mẫu ETV.P.F 29.01 phần 1"
    path: "/modules/M29/registry"
    note: "Bản ghi mới luôn ra đời ở trạng thái Nháp, không có đường nào tạo thẳng ở trạng thái khác. Ô chọn nền tảng chỉ liệt kê nền tảng đã đăng ký và đang hiệu lực tại ETV.MP35. Hai điều bị chặn ngay khi nhập: có xử lý dữ liệu cá nhân thì mức tác động bắt buộc là Cao, và chu kỳ rà soát không được thưa hơn mức tác động cho phép (Cao ≤ 06 tháng, Trung bình ≤ 01 năm). Kỹ năng và công cụ không khai ở đây — gán sau ở trang chi tiết tác tử."
  - role: "Quản trị AI, Lãnh đạo Viện"
    action: "Trình soát xét, soát xét rồi phê duyệt hồ sơ đăng ký hệ thống AI"
    path: "/modules/M29/registry"
    note: "Người lập bản ghi KHÔNG tự soát xét được bản ghi của mình — phần mềm chặn theo người thao tác, không theo vai trò. Phê duyệt, cho hết hiệu lực và hủy là thẩm quyền Lãnh đạo Viện. Mọi nhánh trả lại, từ chối, hết hiệu lực, hủy đều bắt buộc ghi lý do. Cho hồ sơ hết hiệu lực khi tác tử còn đang Hoạt động thì bị chặn: dừng vận hành trước đã. Trạng thái hồ sơ đăng ký tách khỏi trạng thái vận hành — hồ sơ Đã phê duyệt mà tác tử Tạm dừng vì AIA quá hạn là trạng thái bình thường."
  - role: "Quản trị AI"
    action: "Vô hiệu hóa bản ghi Provider, Model, Skill, Tool không còn dùng; kích hoạt lại khi cần"
    path: "/modules/M29/registry"
    note: "Danh mục KHÔNG có nút xóa — mã đã kết thúc không được cấp lại nên bản ghi ở lại làm chứng cứ, chỉ chuyển sang Vô hiệu hóa. Vô hiệu hóa Provider, Model, Skill bắt buộc ghi lý do và bị chặn khi còn bản ghi đang hoạt động trỏ tới: gỡ Provider phải vô hiệu hóa hết Model của nó trước, gỡ Model hay Kỹ năng phải dừng các tác tử đang dùng trước. Kích hoạt lại không cần lý do."
  - role: "Quản trị AI"
    action: "Lập hồ sơ đánh giá tác động (AIA) cho từng tác tử rồi trình soát xét, phê duyệt"
    note: "Chỉ tác tử có AIA đã phê duyệt mới được đưa vào vận hành."
  - role: "Quản trị AI"
    action: "Khai biến môi trường chứa khoá API của nền tảng rồi bấm Kiểm tra ngay để dò sức khoẻ"
    path: "/modules/M29/registry"
    note: "Ô Biến khoá API nhận TÊN BIẾN, không nhận khoá — khoá thật chỉ nằm trong .env của máy chủ. Nền tảng báo Ngừng hoạt động thì đọc dòng lý do ngay dưới huy hiệu ở trang Tổng quan."
  - role: "Quản trị AI"
    action: "Chuyển tác tử sang nền tảng/mô hình khác khi cần, rồi rà soát lại AIA trước khi mở lại"
    note: "Đổi mô hình hoặc nhà cung cấp là thay đổi lớn: tác tử tạm dừng ngay, AIA đang hiệu lực chuyển về Cần rà soát lại; mở lại phải ghi lý do kèm số phiếu kiểm thử."
  - role: "Quản trị AI"
    action: "Gán kỹ năng và whitelist công cụ cho tác tử ở trang chi tiết tác tử"
    note: "Whitelist công cụ là chốt của cổng công cụ: công cụ ngoài danh sách bị chặn bất kể lời nhắc viết gì. Thêm công cụ có mức quyền cao hơn trần đang có là thay đổi lớn — bắt ghi lý do, tác tử tạm dừng ngay, AIA đang hiệu lực về Cần rà soát lại. Bỏ bớt công cụ hoặc thêm công cụ mức không cao hơn thì đổi ngay, chỉ ghi nhật ký. Kỹ năng không cấp quyền hành động nên đổi lúc nào cũng được."
  - role: "Quản trị bảo mật AI"
    action: "Đặt ranh giới dữ liệu cho từng nền tảng và cấu hình guardrail, policy"
    path: "/modules/M29/registry"
    note: "Ranh giới dữ liệu mặc định ở mức siết nhất; nới ra phải dẫn số hồ sơ tương ứng. Ranh giới quyết định trợ lý đọc được tới mức tài liệu nào — để nguyên mức siết nhất thì trợ lý chỉ tra được tài liệu Công khai và hầu như luôn trả lời không tìm thấy căn cứ."
  - role: "Vận hành"
    action: "Theo dõi nhật ký gọi AI và tổng hợp token, chi phí theo tháng"
    path: "/modules/M29/traces"
    note: "Cột Kết quả là chỗ đọc trước tiên: Đạt là lượt trả lời trọn vẹn, Bị chặn là guardrail hoặc cấu hình quản trị chặn lại, Lỗi gọi mô hình là không gọi được máy chủ mô hình (mã lỗi ghi ngay dưới huy hiệu). Bấm thẻ chỉ số ở đầu trang để chỉ xem một nhóm. Lượt bị chặn vẫn tiêu token và vẫn có độ trễ nên không thể phân biệt bằng hai cột đó. Nhật ký gọi AI chỉ mở cho Vận hành, Kiểm toán AI và Quản trị hệ thống; Quản trị AI và Quản trị bảo mật AI không đọc được. Bảng chia 10 lượt mỗi trang, chân bảng ghi số dòng đang xem trên tổng số; thanh lọc theo khoảng ngày, tài khoản gọi và nội dung (tên tác tử, mô hình, công cụ, mã trace). Thẻ chỉ số đếm trong phạm vi thanh lọc, không phải chỉ trang đang xem — bấm Bỏ lọc nhóm để về tất cả kết quả mà vẫn giữ nguyên khoảng ngày và tài khoản đang lọc."
  - role: "Vận hành"
    action: "Ghi kết luận Đạt/Không đạt cho lượt đánh giá chất lượng theo phiếu ETV.P.F29.03 đã ký"
    note: "Trình chạy đánh giá chỉ đo rồi để lượt chạy ở trạng thái Chờ người kết luận — phần mềm không tự kết luận. Cổng triển khai chỉ đọc LƯỢT GẦN NHẤT: chừng nào lượt đó chưa có kết luận Đạt thì không kích hoạt được phiên bản lời nhắc mới. Ghi kết luận bắt buộc dẫn số phiếu và không sửa lại được, nên đọc kỹ trước khi bấm: tổng số câu đạt không thay cho điều kiện bắt buộc — chỉ cần một trong bốn nhóm 3, 4, 5, 7 dưới ngưỡng thì kết luận chung là Không đạt. Quản trị AI cố ý KHÔNG có quyền này: người khai báo cấu hình không tự kết luận cấu hình của mình."
  - role: "Bất kỳ ai phát hiện"
    action: "Lập phiếu sự cố AI, chuyển Đang xử lý, trình xác nhận rồi đóng phiếu"
    path: "/modules/M29/incidents/new"
  - role: "Lãnh đạo Viện"
    action: "Soát xét, phê duyệt, đưa vào vận hành nền tảng; hủy bản ghi chưa phê duyệt hoặc tuyên bố hết hiệu lực nền tảng đã dừng"
    path: "/modules/M29/registry"
    note: "Mọi nhánh trả lại, từ chối, hủy, hết hiệu lực đều bắt buộc ghi lý do. Nền tảng còn tác tử/công cụ đang hoạt động thì không kết thúc vòng đời được; bản ghi không xóa được vì mã nền tảng không cấp lại."
  - role: "Kiểm toán AI"
    action: "Rà soát danh sách AI chưa đăng ký và nhật ký thay đổi cấu hình"
    path: "/modules/M29/unregistered"
    note: "Nhật ký thay đổi cấu hình ở /modules/M29/audit là bảng chỉ-thêm: 10 dòng mỗi trang, chân bảng ghi số dòng đang xem trên tổng số, lọc theo khoảng ngày, tài khoản thực hiện và nội dung (đối tượng, trường, lý do). Không có nút sửa hay xoá — sai sót được đính chính bằng một thao tác mới có ghi lý do, không bằng cách sửa dòng cũ."

tips:
  - "AI không bao giờ được tự ra kết luận đo lường cuối cùng hoặc tự phê duyệt chứng chỉ, kết quả — mọi kết luận vẫn do người có thẩm quyền ký."
