name: Chuyển đổi số và cải tiến hệ thống
purpose: >-
  Thúc đẩy chuyển đổi số trong toàn bộ hoạt động quản lý và chuyên môn, triển khai đồng bộ với cải
  tiến liên tục hệ thống quản lý nhằm nâng cao hiệu quả, năng suất, khả năng truy xuất nguồn gốc
  và chất lượng dịch vụ (QM §9.9).
