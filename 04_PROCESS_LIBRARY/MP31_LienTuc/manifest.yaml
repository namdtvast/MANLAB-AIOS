name: Quản lý tính liên tục hoạt động
purpose: >-
  Bảo đảm khả năng duy trì hoặc khôi phục hoạt động khi xảy ra sự cố với con người, hạ tầng, thiết
  bị, công nghệ thông tin hay dữ liệu — bằng biện pháp phòng ngừa, sao lưu, phục hồi và ứng phó sự
  cố (QM §9.8).
